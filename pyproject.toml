[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugsBounty"
version = "2.1.0"
description = "Autonomous single-agent Offensive Security, Bug Bounty, Red Team & CTF Framework (.bin/ Arsenal + #basement-ops console + Groq/Ollama)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "dnspython>=2.4.0",
    "mmh3>=4.1.0",
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    "jinja2>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
bughunter = "bughunter:main"
bugsbounty = "bughunter:main"
agent = "agents.warroom:cli_entry"

[tool.setuptools]
py-modules = ["bughunter", "bugsBounty"]

[tool.setuptools.packages.find]
include = [
    "core*",
    "tools*",
    "recon*",
    "scan*",
    "agents*",
    "chains*",
    "templates*",
    "exploit*",
    "exfil*",
    "fuzz*",
    "cloud*",
    "cicd*",
    "osint*",
    "redteam*",
    "report*",
    "memory*",
    "web*",
    "tests*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
